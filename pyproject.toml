[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-domain-robustness-synthesis"
version = "0.1.0"
description = "Does a single robustness-retention metric generalise across independently evaluated ML research projects? A synthesis using only already-published results."
requires-python = ">=3.10"

[project.scripts]
cdrs-synthesis = "cross_domain_robustness.synthesis:_cli"

[tool.setuptools.packages.find]
where = ["src"]
